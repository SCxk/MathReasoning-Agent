name: maths-agent

x-platform: &platform
  image: maths-agent:local
  build:
    context: .
    target: runtime
  init: true
  restart: unless-stopped
  environment: &environment
    MATHS_DATABASE_URL: postgresql+psycopg://maths:${MATHS_DB_PASSWORD:?Set MATHS_DB_PASSWORD}@postgres:5432/maths
    MATHS_REDIS_URL: redis://redis:6379/0
    MATHS_QDRANT_URL: http://qdrant:6333
    MATHS_NAMESPACE: maths
    MATHS_RUNTIME: ${MATHS_RUNTIME:-fake}
    MATHS_CLIENT_PROVIDER: ${MATHS_CLIENT_PROVIDER:-}
    MATHS_CLIENT_IDENTITY: ${MATHS_CLIENT_IDENTITY:-}
    MATHS_RAG_ENABLED: "false"
    MATHS_MCP_TOOLS: ${MATHS_MCP_TOOLS:-false}
    MATHS_FUNCTION_CALLING: ${MATHS_FUNCTION_CALLING:-auto}
    MATHS_RAG_DIR: /var/lib/maths/rag
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    qdrant:
      condition: service_started
  networks: [private]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]

services:
  postgres:
    image: postgres:16.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: maths
      POSTGRES_PASSWORD: ${MATHS_DB_PASSWORD:?Set MATHS_DB_PASSWORD}
      POSTGRES_DB: maths
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U maths -d maths"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [private]

  redis:
    image: redis:7.4.5-bookworm
    command: [redis-server, --appendonly, "yes", --appendfsync, always, --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [private]

  qdrant:
    image: qdrant/qdrant:v1.15.1
    restart: unless-stopped
    volumes: [qdrant-data:/qdrant/storage]
    networks: [private]

  migrate:
    <<: *platform
    restart: "no"
    command: [python, -m, agent_platform.deployment, migrate]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *platform
    environment:
      <<: *environment
      MATHS_PROMETHEUS_URL: http://prometheus:9090
    ports: ["127.0.0.1:${MATHS_API_PORT:-8004}:8000"]
    volumes: [document-data:/var/lib/maths/rag]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      start_period: 15s
      retries: 30

  worker:
    <<: *platform
    command: [celery, -A, agent_platform.celery_worker:celery_app, worker, -Q, reasoning, --concurrency=8, --pool=prefork, --loglevel=WARNING, --hostname=reasoning@%h]
    environment:
      <<: *environment
      MATHS_WORKER_GROUP: reasoning
    healthcheck:
      test: [CMD, python, -c, "import os,redis; r=redis.Redis.from_url(os.environ['MATHS_REDIS_URL']); assert r.exists('maths:worker:reasoning')"]
      interval: 3s
      timeout: 3s
      retries: 30

  recovery-worker:
    <<: *platform
    command: [celery, -A, agent_platform.celery_worker:celery_app, worker, -Q, recovery, --concurrency=1, --pool=prefork, --loglevel=WARNING, --hostname=recovery@%h]
    environment:
      <<: *environment
      MATHS_WORKER_GROUP: recovery
    healthcheck:
      test: [CMD, python, -c, "import os,redis; r=redis.Redis.from_url(os.environ['MATHS_REDIS_URL']); assert r.exists('maths:worker:recovery')"]
      interval: 3s
      timeout: 3s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.6.0
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=30d]
    ports: ["127.0.0.1:${MATHS_METRICS_PORT:-9094}:9090"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  document-data:
  prometheus-data:
